<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

  <main class="container py-5">

    <section id="inicio" class="pantalla">
      <div class="card mx-auto shadow-sm" style="max-width: 600px;">
        <div class="card-body text-center p-5">

          <h1 class="mb-4">Quiz</h1>

          <p class="text-muted mb-4">
            Escoja una opción.
          </p>

          <div class="d-grid gap-3">

            <button
              id="btn-iniciar-quiz"
              class="btn btn-primary btn-lg"
              type="button"
            >
              Iniciar Quiz
            </button>

            <button
              id="btn-editar-preguntas"
              class="btn btn-outline-primary btn-lg"
              type="button"
            >
              Editar preguntas
            </button>

          </div>

        </div>
      </div>
    </section>

    <section id="quiz" class="pantalla d-none">

      <div class="card mx-auto shadow-sm" style="max-width: 700px;">
        <div class="card-body p-4">

          <div class="d-flex justify-content-between mb-3">
            <span id="numero-pregunta">
              Pregunta 1 de 5
            </span>

            <span id="cantidad-correctas">
              Correctas: 0
            </span>
          </div>

          <div id="contenedor-pregunta">

          </div>

          <div
            id="contenedor-opciones"
            class="d-grid gap-2 mt-4"
          >

          </div>

          <div
            id="resultado-respuesta"
            class="mt-4"
          >

          </div>

          <div class="d-flex justify-content-between mt-4">

            <button
              id="btn-volver-inicio-quiz"
              class="btn btn-secondary"
              type="button"
            >
              Volver
            </button>

            <button
              id="btn-siguiente"
              class="btn btn-primary"
              type="button"
            >
              Siguiente
            </button>

          </div>

        </div>
      </div>

    </section>

    <section id="editor" class="pantalla d-none">

      <div class="card mx-auto shadow-sm" style="max-width: 900px;">
        <div class="card-body p-4">

          <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="m-0">
              Editar preguntas
            </h2>

            <button
              id="btn-agregar-pregunta"
              class="btn btn-success"
              type="button"
            >
              Agregar pregunta
            </button>

          </div>

          <div id="contenedor-editor">

          </div>

          <div class="d-flex justify-content-between mt-4">

            <button
              id="btn-volver-inicio-editor"
              class="btn btn-secondary"
              type="button"
            >
              Volver
            </button>

            <button
              id="btn-guardar-preguntas"
              class="btn btn-primary"
              type="button"
            >
              Guardar cambios
            </button>

          </div>

        </div>
      </div>

    </section>

    <section id="resultado-final" class="pantalla d-none">

      <div class="card mx-auto shadow-sm" style="max-width: 600px;">
        <div class="card-body text-center p-5">

          <h2 class="mb-4">
            Resultado
          </h2>

          <p
            id="texto-resultado-final"
            class="fs-4"
          >
          </p>

          <div class="d-grid gap-3 mt-4">

            <button
              id="btn-reiniciar-quiz"
              class="btn btn-primary"
              type="button"
            >
              Volver a intentar
            </button>

            <button
              id="btn-volver-inicio-resultado"
              class="btn btn-outline-secondary"
              type="button"
            >
              Volver al inicio
            </button>

          </div>

        </div>
      </div>

    </section>

  </main>

  <script src="Copia de script.js"></script>

</body>
</html>
